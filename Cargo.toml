[package]
name = "wisp"
version = "0.3.0-beta.1"
edition = "2021"
description = "A lightweight, fast, glassy desktop browser built on the system webview."
license = "MIT"
repository = "https://github.com/jakedev2/Wisp"
homepage = "https://github.com/jakedev2/Wisp"
readme = "README.md"
rust-version = "1.77"

[[bin]]
name = "Wisp"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
url = "2"
rfd = "0.15"
ureq = "2"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.33"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
